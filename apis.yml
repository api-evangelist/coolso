name: Coolso
description: Coolso develops wearable gesture-recognition technology. Using patented sensing that detects
  muscle-vibration signals processed through its own AI model, Coolso recognizes individual finger movements
  and strength levels with low-latency response, from a wrist-worn device or an ordinary smartwatch's
  accelerometer and gyroscope without dedicated hardware. Founded by Sheng-Kuei Hsu, Wei-Lin Lee, and Jack Wu
  and based in Cambridge, Massachusetts, the seed-stage company is backed by 500 Global and Alchemist
  Accelerator and targets AR/VR interaction, with potential expansion into medical rehabilitation and sports
  equipment. Coolso publishes no public API, SDK, or developer portal at this time.
